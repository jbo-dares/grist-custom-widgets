<!DOCTYPE html>
<html lang="fr" data-fr-theme="light" data-fr-scheme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="color-scheme" content="light only">
    <!-- DSFR CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/dsfr/dsfr.min.css">
    <link rel="stylesheet" href="https://jbo-dares.github.io/grist-custom-widgets/widgets/common/theme.css">
    <style>
        .fr-header,
        .fr-header__brand {
            filter: none !important;
            --hover: transparent;
        }
    </style>
</head>
<body>

    <header role="banner" class="fr-header">
        <div class="fr-header__body">
            <div class="fr-container">
                <div class="fr-header__body-row">
                    <div class="fr-header__brand fr-enlarge-link">
                        <div class="fr-header__brand-top">
                            <div class="fr-header__logo">
                                <p class="fr-logo" id="intitule-officiel">République<br>Française</p>
                            </div>
                            <div class="fr-header__operator" id="operator-section" style="display: none;">
                                <img class="fr-responsive-img" src="" id="logo-img" alt="Logo Partenaire" style="max-height: 5rem;">
                            </div>
                        </div>
                        <div class="fr-header__service">
                            <a href="#" title="Accueil">
                                <p class="fr-header__service-title" id="txt-titre">En attente de configuration...</p>
                            </a>
                            <p class="fr-header__service-tagline" id="txt-soustitre"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main role="main" id="content" class="fr-container fr-my-4w">
        <div class="fr-grid-row">
            <div class="fr-col-12">
                <p class="fr-text--lead" id="txt-baseline"></p>
                <hr class="fr-pb-2w">
                <div id="txt-masque" class="fr-py-2w fr-text--left"></div>
            </div>
        </div>
    </main>

    <!-- Grist API -->
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <!-- DSFR JS -->
    <script src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/dsfr/dsfr.module.min.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/dsfr/dsfr.nomodule.min.js" nomodule></script>
    <!-- Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // 0. Personnalisation de marked.js pour l'adapter au DSFR
        const renderer = {
            blockquote(token) {
                const insideHtml = this.parser.parse(token.tokens);
                return `<div class="fr-highlight">${insideHtml}</div>`;
            }
        };
        marked.use({ renderer });

        // 0bis. Force le thème clair via l'API officielle du DSFR, et verrouille contre
        // toute réapplication ultérieure du thème sombre.
        // Deux sources peuvent repasser la page en sombre :
        //  - le DSFR lui-même, via une préférence "scheme" persistée dans le localStorage
        //    du domaine jbo-dares.github.io (partagé entre tous les widgets qui y sont servis) ;
        //  - Grist, qui injecte data-grist-theme / data-grist-appearance sur <html> pour
        //    signaler aux widgets que l'espace Grist hôte est en thème sombre, ce qui peut
        //    entraîner un repassage de data-fr-theme à "dark" après notre premier forçage.
        // On force donc une première fois au chargement, puis on surveille en continu
        // l'attribut data-fr-theme et on le recorrige immédiatement s'il change.
        function forceLightScheme() {
            if (window.dsfr) {
                window.dsfr(document.documentElement).scheme.scheme = 'light';
            } else {
                document.documentElement.setAttribute('data-fr-theme', 'light');
                document.documentElement.setAttribute('data-fr-scheme', 'light');
                document.documentElement.style.colorScheme = 'light';
            }
        }
        if (window.dsfr) {
            forceLightScheme();
        } else {
            document.addEventListener('dsfr:ready', forceLightScheme, { once: true });
        }
        new MutationObserver(() => {
            if (document.documentElement.getAttribute('data-fr-theme') !== 'light') {
                forceLightScheme();
            }
        }).observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['data-fr-theme', 'data-fr-scheme', 'data-grist-theme', 'data-grist-appearance']
        });

        // 1. Configuration des colonnes Grist
        grist.ready({
            columns: [
                { name: "intitule_officiel", title: "Bloc marque", type: "Text", optional: true },
                { name: "nom_service", title: "Titre principal", type: "Text", description: "Titre principal" },
                { name: "baseline", title: "Sous-titre", type: "Text", optional: true, description: "Sous-titre" },
                { name: "chapeau", title: "Baseline / Chapeau", type: "Text", optional: true, description: "Chapeau" },
                { name: "masque", title: "Texte / Masque (Markdown)", type: "Text", description: "Contenu. Utilisez {cle} pour insérer une valeur agrégée (voir colonne 'Données agrégées')." },
                { name: "logo", title: "Logo", type: "Attachments", optional: true, description: "Logo à afficher à droite du bloc marque" },
                { name: "donnees_agregees", title: "Données agrégées (JSON)", type: "Text", optional: true, description: "JSON produit par une colonne formule Grist (agrégat/summary table), ex: {\"nb_projets\": 12, \"budget_total\": \"450 000 €\"}. Chaque clé devient utilisable dans le masque via {nb_projets}, {budget_total}, etc." }
            ],
            requiredAccess: 'full'
        });

        // 2. Fonction de gestion du Logo
        async function updateLogo(logoAttachments) {
            const operatorSection = document.getElementById('operator-section');
            const logoImg = document.getElementById('logo-img');

            if (!logoAttachments || !Array.isArray(logoAttachments) || logoAttachments.length === 0) {
                operatorSection.style.display = 'none';
                return;
            }

            try {
                const tokenInfo = await grist.docApi.getAccessToken({ readOnly: true });
                const attachmentId = logoAttachments.at(-1);
                const logoUrl = `${tokenInfo.baseUrl}/attachments/${attachmentId}/download?auth=${tokenInfo.token}`;

                logoImg.src = logoUrl;
                logoImg.onload = () => {
                    operatorSection.style.display = 'block';
                };
                logoImg.onerror = () => {
                    operatorSection.style.display = 'none';
                };

            } catch (error) {
                console.error('Erreur accès attachement:', error);
                operatorSection.style.display = 'none';
            }
        }

        // 2bis. Remplace les {cle} présents dans un texte par les valeurs d'un contexte
        // Les clés non trouvées dans le contexte sont laissées telles quelles (utile pour
        // repérer une faute de frappe dans le masque plutôt que de faire disparaître le texte).
        function templatize(text, context) {
            if (!text) return text;
            return text.replace(/\{(\w+)\}/g, (match, key) => {
                const value = context[key];
                return (value !== undefined && value !== null) ? String(value) : match;
            });
        }

        // 3. Fonction principale de mise à jour
        async function updateContent(mapped) {
            if (!mapped) {
                document.getElementById('txt-titre').textContent = "⚠️ En attente de configuration des colonnes";
                return;
            }

            if (mapped.intitule_officiel) {
                const intitule = mapped.intitule_officiel.replace(/\n/g, '<br>');
                document.getElementById('intitule-officiel').innerHTML = intitule;
            } else {
                document.getElementById('intitule-officiel').innerHTML = 'République<br>Française';
            }

            if (mapped.logo) {
                await updateLogo(mapped.logo);
            } else {
                document.getElementById('operator-section').style.display = 'none';
            }

            document.getElementById('txt-titre').textContent = mapped.nom_service || 'Titre non renseigné';
            document.getElementById('txt-soustitre').textContent = mapped.baseline || '';
            document.getElementById('txt-baseline').textContent = mapped.chapeau || '';

            // Construction du contexte de substitution : colonnes du record + JSON agrégé
            let aggData = {};
            if (mapped.donnees_agregees) {
                try {
                    aggData = JSON.parse(mapped.donnees_agregees);
                } catch (error) {
                    console.error('JSON invalide dans "Données agrégées" :', error);
                }
            }
            const context = { ...mapped, ...aggData };

            if (mapped.masque) {
                const texteAvecDonnees = templatize(mapped.masque, context);
                document.getElementById('txt-masque').innerHTML = marked.parse(texteAvecDonnees);
            } else {
                document.getElementById('txt-masque').innerHTML = "<p><em>Aucun masque renseigné pour cette page.</em></p>";
            }
        }

        // 4. Réception du flux
        grist.onRecords(async function (records, mappings) {
            if (records && records.length > 0) {
                const mapped = grist.mapColumnNames(records[0], mappings);
                await updateContent(mapped);
            } else {
                await updateContent(null);
            }
        });
    </script>
</body>
</html>
